      background-attachment: fixed;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(9, 9, 11, 0.985);
      pointer-events: none;
      z-index: 0;
    }

    .scroll-dark::-webkit-scrollbar { width: 10px; height: 10px; }
    .scroll-dark::-webkit-scrollbar-track { background: #18181b; }
    .scroll-dark::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 6px; border: 2px solid #18181b; }

    .chev { transition: transform 0.2s ease; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fadeIn 0.15s ease-out; }
  </style>
</head>

      ],

        'ENU/Baja': '',
        'Frecuencia MP': 'Cuatrimestral'
      },
      ['X','','','','X','','','','X','','',''],
      ['Si','','','','Si','','','','','','',''],
      [
        { tipo:'MP', fecha:'2026-01-22', ejecutor:'Matías Soazo Garrido', detalle:'MP cuatrimestral. Test de fugas OK. Sellos cambiados.', estado:'operativo' },
        { tipo:'MP', fecha:'2026-05-08', ejecutor:'Matías Soazo Garrido', detalle:'MP cuatrimestral. Calibración de vaporizadores conforme.', estado:'operativo' },
        { tipo:'Reparación', fecha:'2026-04-30', ejecutor:'Matías Soazo Garrido', detalle:'Cambio de manguera de O2 — desgaste detectado en inspección.', estado:'operativo' }
      ],
      [])

    // ───── Estado en memoria ─────
    const state = {
      equipos: MOCK.slice(),
      query: '',
      filename: null,
      colsDetectadas: [],
      filasDetectadas: 0
    };

    // ───── Utilidades (badgeClasses, normalizar, debounce) ─────
    function debounce(fn, ms) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    function norm(s) {
      return (s == null ? '' : String(s))
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '') // strip diacritics
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Aliases canónicos → cualquiera de estas variantes normalizadas calza
    const CANON_ALIAS = {
      'N° Inventario': ['n° inventario','n inventario','no inventario','nro inventario','numero inventario','n. inventario','inventario'],
      'Serie':         ['serie','n° serie','n serie','numero de serie','nro serie','serial'],
      'Equipo':        ['equipo','nombre equipo','nombre del equipo','denominacion','denominacion equipo'],
      'Servicio':      ['servicio','servicio clinico','servicio clínico'],
      'Marca':         ['marca'],
      'Modelo':        ['modelo'],
      'Ubicación':     ['ubicacion','ubicación','ubic'],
      'Clasificación': ['clasificacion','clasificación','categoria','categoría'],
      'N° Carpeta':    ['n° carpeta','n carpeta','no carpeta','nro carpeta','carpeta'],
      'Unidad':        ['unidad','box','sala','cama'],
      'Procedencia':   ['procedencia','origen'],
      'Año Instalación': ['ano instalacion','ano instalación','año instalacion','año instalación','anio instalacion','fecha instalacion','año'],
      'Vida Útil Residual': ['vida util residual','vida útil residual','vur'],
      'ENU/Baja':      ['enu/baja','enu baja','enu','baja'],
      'Frecuencia MP': ['frecuencia mp','frecuencia','frec mp','frec.']
    };

    // Devuelve el valor real desde un ident usando aliases del canónico
    function getIdent(ident, canon) {
      if (ident[canon] !== undefined && ident[canon] !== '') return ident[canon];
      const aliases = CANON_ALIAS[canon] || [];
      for (const k of Object.keys(ident)) {
        if (aliases.includes(norm(k))) return ident[k];
      }
      // Fallback: comparación normalizada con el propio canon
      const cnorm = norm(canon);
      for (const k of Object.keys(ident)) {
        if (norm(k) === cnorm) return ident[k];
      }
      return '';
    }

    // Meses: aliases (corto, largo, abreviado)
    const MES_ALIAS = {
      Ene:['ene','enero','jan','january','1','01'],
      Feb:['feb','febrero','february','2','02'],
      Mar:['mar','marzo','march','3','03'],
      Abr:['abr','abril','april','4','04'],
      May:['may','mayo','5','05'],
      Jun:['jun','junio','june','6','06'],
      Jul:['jul','julio','july','7','07'],
      Ago:['ago','agosto','august','aug','8','08'],
      Sep:['sep','sept','septiembre','september','9','09'],
      Oct:['oct','octubre','october','10'],
      Nov:['nov','noviembre','november','11'],
      Dic:['dic','diciembre','december','dec','12']
    };

    function mesDe(headerVal) {
      const v = norm(headerVal);
      if (!v) return null;
      for (const m of MESES) {
        if (MES_ALIAS[m].includes(v)) return m;
        // tolerar variantes con punto: "ene."
        if (MES_ALIAS[m].includes(v.replace(/\./g,''))) return m;
      }
      return null;
    }

    function badgeClasses(codigo) {
      const base = 'inline-flex items-center justify-center px-1.5 py-0.5 rounded text-[10px] mono font-semibold uppercase tracking-wider border';
      switch ((codigo || '').toString().trim()) {
        case 'X':    return `${base} bg-amber-500/10 border-amber-500/40 text-amber-300`;
        case 'R':    return `${base} bg-cyan-500/10 border-cyan-500/40 text-cyan-300`;
        case 'RA':   return `${base} bg-violet-500/10 border-violet-500/40 text-violet-300`;
        case 'PM':   return `${base} bg-fuchsia-500/10 border-fuchsia-500/40 text-fuchsia-300`;
        case 'Si':   return `${base} bg-emerald-500/10 border-emerald-500/40 text-emerald-300`;
        case 'FS':   return `${base} bg-red-500/15 border-red-500/50 text-red-300`;
        case 'NU':   return `${base} bg-orange-500/10 border-orange-500/40 text-orange-300`;
        case 'Baja': return `${base} bg-zinc-500/15 border-zinc-500/40 text-zinc-300`;
        case 'C1': case 'C2': case 'C3': case 'C4':
        case 'C5': case 'C6': case 'C7': case 'C8':
          return `${base} bg-red-900/30 border-red-700/40 text-red-300/90`;
        default: return `${base} bg-zinc-800/40 border-zinc-700/50 text-zinc-500`;
      }
    }

    function badgeEstado(estado) {
      const op = norm(estado) === 'operativo';
      const cls = op
        ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-300'
        : 'bg-red-500/15 border-red-500/50 text-red-300';
      return `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] mono font-semibold uppercase tracking-wider border ${cls}">${op ? 'Operativo' : 'No operativo'}</span>`;
    }

    function iconoTipo(tipo) {
      switch (tipo) {
        case 'MP':         return 'activity';
        case 'Envío':      return 'send';
        case 'Recepción':  return 'inbox';
        case 'Solicitud':  return 'file-text';
        case 'Reparación': return 'hammer';
        default:           return 'package';
      }
    }

    function badgeTipo(tipo) {
      const cls = {
        'MP':         'bg-amber-500/10 border-amber-500/40 text-amber-300',
        'Envío':      'bg-cyan-500/10 border-cyan-500/40 text-cyan-300',
        'Recepción':  'bg-emerald-500/10 border-emerald-500/40 text-emerald-300',
        'Solicitud':  'bg-violet-500/10 border-violet-500/40 text-violet-300',
        'Reparación': 'bg-fuchsia-500/10 border-fuchsia-500/40 text-fuchsia-300'
      }[tipo] || 'bg-zinc-800/40 border-zinc-700/50 text-zinc-400';
      return `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] mono font-semibold uppercase tracking-wider border ${cls}">${tipo}</span>`;
    }

    function esc(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ───── Carga de Excel ─────
    const IGNORADAS_NORM = COLS_IGNORADAS.map(c => norm(c));

    function esColumnaIgnorada(name) {
      return IGNORADAS_NORM.includes(norm(name));
    }

    // Detecta índices de columnas mensuales en un header simple (PMP_2026)
    function detectarMesesHeader(header) {
      const monthIdx = {};
      header.forEach((h, i) => {
        const m = mesDe(h);
        if (m && monthIdx[m] == null) monthIdx[m] = i;
      });
      return monthIdx;
    }

    // Detecta columnas mensuales con sub-cabeceras P/R (Registro_MP-2026)
    // Soporta header en una o dos filas. Retorna { Ene:{P:idx,R:idx}, ... } y headerRowsUsed.
    function detectarRegistroPR(rows) {
      const r0 = (rows[0] || []).map(v => String(v ?? ''));
      const r1 = (rows[1] || []).map(v => String(v ?? ''));
      const monthCols = {};
      let cur = null;
      const W = Math.max(r0.length, r1.length);
      for (let i = 0; i < W; i++) {
        const m0 = mesDe(r0[i]);
        if (m0) cur = m0;
        const v1 = norm(r1[i]);
        const sub = v1 === 'p' || v1 === 'programacion' ? 'P'
                  : v1 === 'r' || v1 === 'resultado' || v1 === 'resultados' ? 'R'
                  : null;
        if (cur && sub) {
          monthCols[cur] = monthCols[cur] || {};
          monthCols[cur][sub] = i;
        }
      }
      // Si no detectamos P/R en r1, devolver null para que el caller use el formato simple
      const anyPR = Object.values(monthCols).some(o => o.P != null || o.R != null);
      return anyPR ? { cols: monthCols, dataStart: 2 } : null;
    }

    function cargarArchivo(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const wb = XLSX.read(e.target.result, { type: 'array' });
          const sheetPMP = wb.SheetNames.find(n => /PMP/i.test(n)) || wb.SheetNames[0];
          const sheet = wb.Sheets[sheetPMP];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
          if (!rows.length) throw new Error('Hoja vacía');

          const header = rows[0].map(h => String(h ?? '').trim());
          const monthIdx = detectarMesesHeader(header);
          const monthIdxSet = new Set(Object.values(monthIdx));

          // Columnas de identificación: todo lo que no es mes, no está vacío, no está ignorado
          const identCols = header
            .map((h, i) => ({ name: h, i }))
            .filter(c => c.name && !monthIdxSet.has(c.i) && !esColumnaIgnorada(c.name));

          const equipos = [];
          for (let r = 1; r < rows.length; r++) {
            const row = rows[r] || [];
            const ident = {};
            identCols.forEach(c => { ident[c.name] = row[c.i] ?? ''; });
            const programacion = MESES.map(m => {
              const idx = monthIdx[m];
              if (idx == null) return '';
              return String(row[idx] ?? '').trim();
            });
            const resultados = MESES.map(() => '');
            const hasInventario = norm(getIdent(ident,'N° Inventario')) !== ''
                              || norm(getIdent(ident,'Serie')) !== ''
                              || norm(getIdent(ident,'Equipo')) !== '';
            equipos.push({
              id: r,
              ident,
              programacion,
              resultados,
              eventos: [],
              pendientes: [],
              slot: !hasInventario
            });
          }

          // ── Hidratar resultados desde Registro_MP-2026 si existe ──
          const sheetRegName = wb.SheetNames.find(n => /registro/i.test(n));
          let regHidratados = 0;
          if (sheetRegName) {
            const rsheet = wb.Sheets[sheetRegName];
            const rrows = XLSX.utils.sheet_to_json(rsheet, { header: 1, defval: '' });
            if (rrows.length >= 2) {
              const pr = detectarRegistroPR(rrows);
              if (pr) {
                // Buscar índice de N° Inventario y Serie en row 1 (asumiendo header en r0 o r1)
                // Probamos r0 y r1 para encontrar columnas clave
                const findKey = (canon) => {
                  const aliases = (CANON_ALIAS[canon] || []).concat([norm(canon)]);
                  for (const rowH of [rrows[0], rrows[1]]) {
                    if (!rowH) continue;
                    for (let i = 0; i < rowH.length; i++) {
                      if (aliases.includes(norm(rowH[i]))) return i;
                    }
                  }
                  return -1;
                };
                const idxInv = findKey('N° Inventario');
                const idxSer = findKey('Serie');
                for (let r = pr.dataStart; r < rrows.length; r++) {
                  const row = rrows[r] || [];
                  const inv = idxInv >= 0 ? norm(row[idxInv]) : '';
                  const ser = idxSer >= 0 ? norm(row[idxSer]) : '';
                  if (!inv && !ser) continue;
                  const eq = equipos.find(e => {
                    const eInv = norm(getIdent(e.ident,'N° Inventario'));
                    const eSer = norm(getIdent(e.ident,'Serie'));
                    return (inv && eInv === inv) || (ser && eSer === ser);
                  });
                  if (!eq) continue;
                  MESES.forEach((m, i) => {
                    const cells = pr.cols[m];
                    if (!cells) return;
                    if (cells.P != null) {
                      const v = String(row[cells.P] ?? '').trim();
                      if (v && !eq.programacion[i]) eq.programacion[i] = v;
                    }
                    if (cells.R != null) {
                      const v = String(row[cells.R] ?? '').trim();
                      if (v) eq.resultados[i] = v;
                    }
                  });
                  regHidratados++;
                }
              }
            }
          }

          state.equipos = equipos;
          state.filename = file.name;
          state.colsDetectadas = header;
          state.filasDetectadas = equipos.length;
          state.identCols = identCols.map(c => c.name);
          state.hojaPMP = sheetPMP;
          state.hojaReg = sheetRegName || null;
          state.regHidratados = regHidratados;

          mostrarFeedbackCarga();
          render();
        } catch (err) {
          console.error(err);
          alert('No se pudo leer el archivo: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function mostrarFeedbackCarga() {
      const fb = document.getElementById('loadFeedback');
      fb.classList.remove('hidden');
      const regTxt = state.hojaReg
        ? ` · Resultados hidratados desde <span class="text-zinc-200">${esc(state.hojaReg)}</span> (<span class="text-zinc-200">${state.regHidratados}</span>)`
        : '';
      fb.innerHTML = `<span class="text-amber-400">●</span> Archivo: <span class="text-zinc-200">${esc(state.filename)}</span> · Hoja <span class="text-zinc-200">${esc(state.hojaPMP)}</span> · <span class="text-zinc-200">${state.colsDetectadas.length}</span> columnas · <span class="text-zinc-200">${state.filasDetectadas}</span> filas${regTxt}`;
      const ls = document.getElementById('loadStatus');
      ls.classList.remove('hidden');
      ls.classList.add('flex');
      ls.innerHTML = `<i data-lucide="package" class="w-3.5 h-3.5"></i><span>${esc(state.filename)}</span>`;
      lucide.createIcons();
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (f) cargarArchivo(f);
    });

    // ───── Búsqueda y render de resultados ─────
    function filtrar(q) {
      const nq = norm(q);
      const visibles = state.equipos.filter(e => !e.slot);
      if (!nq) return visibles.slice(0, 30);
      const out = [];
      for (const eq of visibles) {
        const inv = norm(getIdent(eq.ident,'N° Inventario'));
        const ser = norm(getIdent(eq.ident,'Serie'));
        const nom = norm(getIdent(eq.ident,'Equipo'));
        if (inv.includes(nq) || ser.includes(nq) || nom.includes(nq)) {
          out.push(eq);
          if (out.length >= 50) break;
        }
      }
      return out;
    }

    function render() {
      const results = document.getElementById('results');
      const empty = document.getElementById('emptyState');
      const meta = document.getElementById('resultsMeta');
      const list = filtrar(state.query);

      meta.textContent = state.query
        ? `${list.length} resultado${list.length === 1 ? '' : 's'} para "${state.query}"`
        : `Mostrando primeros ${list.length} equipos · Total en memoria: ${state.equipos.filter(e => !e.slot).length}`;

      if (!list.length) {
        results.innerHTML = '';
        empty.classList.remove('hidden');
        lucide.createIcons();
        return;
      }
      empty.classList.add('hidden');

      results.innerHTML = list.map(eq => tarjetaEquipo(eq)).join('');
      // listeners
      results.querySelectorAll('[data-eq-id]').forEach(card => {
        card.addEventListener('click', () => {
          const id = Number(card.getAttribute('data-eq-id'));
          const eq = state.equipos.find(e => e.id === id);
          if (eq) abrirModal(eq);
        });
      });
      lucide.createIcons();
    }

    function tarjetaEquipo(eq) {
      const nombre = esc(getIdent(eq.ident,'Equipo') || '—');
      const clas = esc(getIdent(eq.ident,'Clasificación') || '');
      const inv = esc(getIdent(eq.ident,'N° Inventario') || '—');
      const ser = esc(getIdent(eq.ident,'Serie') || '—');
      const mm  = esc([getIdent(eq.ident,'Marca'), getIdent(eq.ident,'Modelo')].filter(Boolean).join(' · '));
      const srv = esc(getIdent(eq.ident,'Servicio') || '');
      const clasBadge = clas
        ? `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] mono font-semibold uppercase tracking-wider border bg-amber-500/10 border-amber-500/40 text-amber-300">${clas}</span>`
        : '';
      return `
        <button data-eq-id="${eq.id}" class="text-left bg-zinc-900/50 hover:bg-zinc-900 border border-zinc-800 hover:border-amber-500/40 rounded-lg p-4 transition-colors group">
          <div class="flex items-start justify-between gap-2 mb-2">
            <div class="font-semibold text-zinc-100 text-sm leading-tight group-hover:text-amber-300 transition-colors">${nombre}</div>
            ${clasBadge}
          </div>
          <div class="space-y-1 text-[11px] mono">
            <div class="flex justify-between gap-2"><span class="text-zinc-500 uppercase tracking-wider">Inv.</span><span class="text-zinc-300">${inv}</span></div>
            <div class="flex justify-between gap-2"><span class="text-zinc-500 uppercase tracking-wider">Serie</span><span class="text-zinc-300 truncate">${ser}</span></div>
            <div class="flex justify-between gap-2"><span class="text-zinc-500 uppercase tracking-wider">M/M</span><span class="text-zinc-400 truncate">${mm || '—'}</span></div>
            <div class="flex justify-between gap-2"><span class="text-zinc-500 uppercase tracking-wider">Servicio</span><span class="text-zinc-400">${srv || '—'}</span></div>
          </div>
        </button>
      `;
    }

    // ───── Modal: apertura, cierre, render de identificación, programación, registros, pendientes ─────
    const modal = document.getElementById('modal');
    const modalHeader = document.getElementById('modalHeader');
    const modalBody = document.getElementById('modalBody');
    const modalFooter = document.getElementById('modalFooter');

    function abrirModal(eq) {
      modalHeader.innerHTML = renderCabecera(eq);
      modalBody.innerHTML = renderCuerpo(eq);
      modalFooter.innerHTML = renderFooter(eq);
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      // Wire up: cierre con X
      modalHeader.querySelector('[data-close]')?.addEventListener('click', cerrarModal);
      // Wire up: chevrons de secciones
      modalBody.querySelectorAll('[data-toggle]').forEach(h => {
        h.addEventListener('click', () => {
          const target = h.getAttribute('data-toggle');
          const cont = modalBody.querySelector(`[data-section="${target}"]`);
          const chev = h.querySelector('.chev');
          if (cont.classList.contains('hidden')) {
            cont.classList.remove('hidden');
            chev.classList.remove('rot');
          } else {
            cont.classList.add('hidden');
            chev.classList.add('rot');
          }
        });
      });
      // Stub "Registrar evento"
      modalFooter.querySelector('[data-registrar]')?.addEventListener('click', () => {
        console.log('Registrar evento — equipo:', getIdent(eq.ident,'N° Inventario'), getIdent(eq.ident,'Serie'));
      });
      lucide.createIcons();
    }

    function cerrarModal() {
      modal.classList.add('hidden');
      document.body.style.overflow = '';
    }

    // Cerrar con backdrop click
    modal.addEventListener('click', (e) => {
      if (e.target === modal) cerrarModal();
    });
    // Cerrar con Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modal.classList.contains('hidden')) cerrarModal();
    });

    function renderCabecera(eq) {
      const nombre = esc(getIdent(eq.ident,'Equipo') || '—');
      const mm = esc([getIdent(eq.ident,'Marca'), getIdent(eq.ident,'Modelo')].filter(Boolean).join(' · '));
      const ubi = esc(getIdent(eq.ident,'Ubicación') || '');
      const clas = esc(getIdent(eq.ident,'Clasificación') || '');
      const srv = esc(getIdent(eq.ident,'Servicio') || '');
      return `
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap mb-1">
            <h2 class="text-xl font-semibold text-zinc-100">${nombre}</h2>
            ${clas ? `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] mono font-semibold uppercase tracking-wider border bg-amber-500/10 border-amber-500/40 text-amber-300">${clas}</span>` : ''}
            ${srv ? `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] mono font-semibold uppercase tracking-wider border bg-zinc-800/60 border-zinc-700 text-zinc-300">${srv}</span>` : ''}
          </div>
          <p class="text-[11px] mono uppercase tracking-wider text-zinc-500">${mm}${mm && ubi ? ' · ' : ''}${ubi}</p>
        </div>
        <button data-close class="shrink-0 w-9 h-9 rounded-lg border border-zinc-800 hover:border-zinc-600 bg-zinc-900 hover:bg-zinc-800 flex items-center justify-center transition-colors" aria-label="Cerrar">
          <i data-lucide="x" class="w-4 h-4 text-zinc-400"></i>
        </button>
      `;
    }

    function renderCuerpo(eq) {
      return renderIdentificacion(eq) + renderProgramacion(eq) + renderRegistros(eq) + renderPendientes(eq);
    }

    function renderIdentificacion(eq) {
      // Mostrar TODAS las columnas detectadas del Excel, en su orden original;
      // si no hay (mock o vacío), usar la lista canónica.
      let campos = Object.keys(eq.ident).filter(k => k && !esColumnaIgnorada(k));
      if (!campos.length) campos = COL_IDENT.filter(c => eq.ident[c] !== undefined);
      const cells = campos.map(c => {
        const v = eq.ident[c];
        const val = (v === '' || v == null) ? '—' : String(v);
        return `
          <div class="bg-zinc-950/60 border border-zinc-800 rounded-md px-3 py-2">
            <div class="text-[10px] mono uppercase tracking-wider text-zinc-500 mb-0.5">${esc(c)}</div>
            <div class="text-[12px] mono text-zinc-200 break-words">${esc(val)}</div>
          </div>
        `;
      }).join('');
      return `
        <div class="bg-zinc-900/40 border border-zinc-800 rounded-lg p-4">
          <div class="text-[11px] mono uppercase tracking-wider text-zinc-500 mb-3 flex items-center gap-2">
            <i data-lucide="package" class="w-3.5 h-3.5"></i> Identificación
            <span class="ml-auto text-zinc-600">${campos.length} campos</span>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-2">${cells}</div>
        </div>
      `;
    }

    function tooltipParaCodigo(c) {
      const k = String(c || '').trim();
      if (CAUSALES[k]) return ` title="${esc(k + ' — ' + CAUSALES[k])}"`;
      return '';
    }

    function renderProgramacion(eq) {
      const headers = MESES.map(m => `<th class="px-2 py-1 text-[10px] mono uppercase tracking-wider text-zinc-500 text-center">${m}</th>`).join('');
      const fP = MESES.map((m, i) => {
        const c = eq.programacion[i];
        return `<td class="px-1 py-1 text-center">${c ? `<span class="${badgeClasses(c)}"${tooltipParaCodigo(c)}>${esc(c)}</span>` : '<span class="text-zinc-700">·</span>'}</td>`;
      }).join('');
      const fR = MESES.map((m, i) => {
        const c = eq.resultados[i];
        return `<td class="px-1 py-1 text-center">${c ? `<span class="${badgeClasses(c)}"${tooltipParaCodigo(c)}>${esc(c)}</span>` : '<span class="text-zinc-700">·</span>'}</td>`;
      }).join('');

      const leyendaP = CODIGOS_P.map(c => `<span class="${badgeClasses(c)}">${c}</span>`).join(' ');
      const leyendaR = CODIGOS_R.map(c => `<span class="${badgeClasses(c)}"${tooltipParaCodigo(c)}>${c}</span>`).join(' ');

      return seccionColapsable('prog', 'Programación MP 2026', 'clock', `
        <div class="overflow-x-auto scroll-dark">
          <table class="w-full border-separate border-spacing-0">
            <thead>
              <tr>
                <th class="px-2 py-1 text-[10px] mono uppercase tracking-wider text-zinc-500 text-left w-32">Fila</th>
                ${headers}
              </tr>
            </thead>
            <tbody>
              <tr class="bg-zinc-950/40">
                <td class="px-2 py-1 text-[11px] mono uppercase tracking-wider text-zinc-400">Programación</td>
                ${fP}
              </tr>
              <tr class="bg-zinc-950/60">
                <td class="px-2 py-1 text-[11px] mono uppercase tracking-wider text-zinc-400">Resultado</td>
                ${fR}
              </tr>
            </tbody>
          </table>
        </div>
        <div class="mt-3 space-y-2 text-[11px]">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="mono uppercase tracking-wider text-zinc-500">Programación:</span>
            ${leyendaP}
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <span class="mono uppercase tracking-wider text-zinc-500">Resultado:</span>
            ${leyendaR}
          </div>
          <div class="text-[10px] mono text-zinc-600 italic">Tooltip sobre causales C1–C8 para ver la descripción.</div>
        </div>
      `);
    }

    function renderRegistros(eq) {
      if (!eq.eventos.length) {
        return seccionColapsable('reg', 'Registros asociados', 'file-text', `
          <div class="text-center py-6 text-zinc-600 text-[12px] mono italic">Sin registros para este equipo.</div>
        `);
      }
      const items = eq.eventos.map(ev => {
        const ic = iconoTipo(ev.tipo);
        const extras = [];
        if (ev.folio) extras.push(`Folio ${esc(ev.folio)}`);
        if (ev.envio) extras.push(`Envío ${esc(ev.envio)}`);
        if (ev.empresa) extras.push(esc(ev.empresa));
        if (ev.folioGuia) extras.push(`Guía ${esc(ev.folioGuia)}`);
        const extrasTxt = extras.length ? `<div class="text-[10px] mono uppercase tracking-wider text-zinc-500 mt-1">${extras.join(' · ')}</div>` : '';
        return `
          <li class="flex items-start gap-3 px-3 py-3 border-b border-zinc-800/70 last:border-b-0">
            <div class="shrink-0 w-8 h-8 rounded-md bg-zinc-950/70 border border-zinc-800 flex items-center justify-center mt-0.5">
              <i data-lucide="${ic}" class="w-4 h-4 text-amber-400"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="mono text-[11px] text-zinc-300">${esc(ev.fecha)}</span>
                ${badgeTipo(ev.tipo)}
                ${ev.ejecutor ? `<span class="text-[11px] text-zinc-400">${esc(ev.ejecutor)}</span>` : ''}
              </div>
              <div class="text-[12px] text-zinc-300 mt-1 leading-relaxed">${esc(ev.detalle || '')}</div>
              ${extrasTxt}
            </div>
            <div class="shrink-0">${ev.estado ? badgeEstado(ev.estado) : ''}</div>
          </li>
        `;
      }).join('');
      return seccionColapsable('reg', 'Registros asociados', 'file-text', `
        <ul class="divide-y divide-zinc-800/70">${items}</ul>
      `);
    }

    function renderPendientes(eq) {
      if (!eq.pendientes.length) {
        return seccionColapsable('pend', 'Pendientes', 'alert-triangle', `
          <div class="text-center py-6 text-zinc-600 text-[12px] mono italic">Sin pendientes para este equipo.</div>
        `);
      }
      const hoy = new Date('2026-05-25T00:00:00');
      const items = eq.pendientes.map(p => {
        const fComp = new Date(p.fechaCompromiso + 'T00:00:00');
        const vencida = fComp < hoy;
        const cls = vencida
          ? 'bg-red-500/10 border-red-500/40 text-red-300'
          : 'bg-emerald-500/10 border-emerald-500/40 text-emerald-300';
        return `
          <li class="flex items-start gap-3 px-3 py-3 border-b border-zinc-800/70 last:border-b-0">
            <div class="shrink-0 w-8 h-8 rounded-md ${vencida ? 'bg-red-500/10 border-red-500/40' : 'bg-zinc-950/70 border-zinc-800'} border flex items-center justify-center mt-0.5">
              <i data-lucide="alert-triangle" class="w-4 h-4 ${vencida ? 'text-red-400' : 'text-amber-400'}"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-[13px] text-zinc-200">${esc(p.tarea)}</div>
              <div class="text-[10px] mono uppercase tracking-wider text-zinc-500 mt-1">Solicitud: <span class="text-zinc-300">${esc(p.fechaSolicitud)}</span> · Responsable: <span class="text-zinc-300">${esc(p.responsable)}</span></div>
            </div>
            <div class="shrink-0 text-right">
              <div class="text-[10px] mono uppercase tracking-wider text-zinc-500">Compromiso</div>
              <span class="inline-flex items-center px-2 py-0.5 mt-0.5 rounded text-[11px] mono font-semibold border ${cls}">${esc(p.fechaCompromiso)}${vencida ? ' · vencida' : ''}</span>
            </div>
          </li>
        `;
      }).join('');
      return seccionColapsable('pend', 'Pendientes', 'alert-triangle', `
        <ul class="divide-y divide-zinc-800/70">${items}</ul>
      `);
    }

    function seccionColapsable(key, titulo, icono, contenido) {
      return `
        <div class="bg-zinc-900/40 border border-zinc-800 rounded-lg overflow-hidden">
          <button data-toggle="${key}" class="w-full px-4 py-2.5 flex items-center gap-2 text-left hover:bg-zinc-900/70 transition-colors">
            <i data-lucide="${icono}" class="w-3.5 h-3.5 text-amber-400"></i>
            <span class="text-[11px] mono uppercase tracking-wider text-zinc-300 flex-1">${esc(titulo)}</span>
            <i data-lucide="chevron-down" class="w-4 h-4 text-zinc-500 chev"></i>
          </button>
          <div data-section="${key}" class="px-4 py-3 border-t border-zinc-800">${contenido}</div>
        </div>
      `;
    }

    function renderFooter(eq) {
      const inv = esc(getIdent(eq.ident,'N° Inventario') || '—');
      const ser = esc(getIdent(eq.ident,'Serie') || '—');
      return `
        <div class="flex-1 min-w-0 flex items-center gap-4 flex-wrap">
          <span>Inv: <span class="text-zinc-200">${inv}</span></span>
          <span>Serie: <span class="text-zinc-200">${ser}</span></span>
        </div>
        <button data-registrar class="inline-flex items-center gap-2 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-medium px-3 py-2 rounded-md text-[12px] transition-colors">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span class="normal-case tracking-normal">Registrar evento</span>
        </button>
      `;
    }

    // ───── Inicialización ─────
    document.getElementById('searchInput').addEventListener('input', debounce((e) => {
      state.query = e.target.value;
      render();
    }, 150));

    render();
    lucide.createIcons();
  </script>
</body>
</html>
